services:

  kafka:
    image: apache/kafka:latest
    container_name: muezzin-kafka
    ports:
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: muezzin-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka

  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: muezzin-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  kibana:
    image: kibana:7.17.10
    container_name: muezzin-kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  mongodb:
    image: mongo:latest
    container_name: muezzin-mongo
    ports:
      - '27017:27017'

  audio_loading:
    build:
      context: .
      dockerfile: audio_loading/Dockerfile
    container_name: audio_loading
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      PODCASTS_PATH: "/app/podcasts"
    volumes:
      - ./podcasts:/app/podcasts
    depends_on:
      - kafka
      - elasticsearch

  data_processing:
    build:
      context: .
      dockerfile: data_processing/Dockerfile
    container_name: data_processing
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      MONGO_URI: "mongodb://mongodb:27017/"
      PODCASTS_PATH: "/app/podcasts"
    volumes:
      - ./podcasts:/app/podcasts
    depends_on:
      - kafka
      - mongodb
      - elasticsearch

  logic:
    build:
      context: .
      dockerfile: ranking_logic/Dockerfile
    container_name: logic
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      PODCASTS_PATH: "/app/podcasts"
    volumes:
      - ./podcasts:/app/podcasts
    depends_on:
      - kafka
      - elasticsearch